<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141a35"><title>星星俄罗斯方块</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#f4f7ff;background:#10162e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#344276,#10162e 60%);overflow-x:hidden}.wrap{width:min(100%,520px);margin:auto;padding:16px 12px 28px}header{text-align:center;margin-bottom:12px}h1{font-size:clamp(25px,7vw,35px);margin:2px 0 5px;color:#ffe285}header p{margin:0;color:#c0ceef;font-size:14px}.stats{display:flex;gap:8px;justify-content:center;margin-bottom:12px}.stat{background:#26345d;border:1px solid #445a8c;border-radius:12px;padding:7px 10px;flex:1;text-align:center}.stat small{display:block;color:#bdc9e9;font-size:12px}.stat strong{font-size:20px}.stage{display:grid;grid-template-columns:minmax(0,300px) minmax(94px,1fr);gap:12px;align-items:start;justify-content:center}.board-wrap{position:relative;max-width:300px;width:100%;aspect-ratio:1/2;border:4px solid #88a5e5;border-radius:12px;overflow:hidden;box-shadow:0 9px 30px #030814a8;background:#121a34}#board{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#08132bc9;padding:10px}.overlay[hidden]{display:none}.overlay strong{font-size:24px;color:#ffe285}.overlay span{font-size:14px;line-height:1.5;margin-top:7px}.aside{background:#243258;border:1px solid #445a8c;border-radius:12px;padding:10px;text-align:center}.aside h2{font-size:15px;margin:0 0 8px}.aside canvas{width:min(100%,112px);height:auto;background:#17213e;border-radius:8px}.aside p{font-size:12px;line-height:1.55;color:#c6d4f5;margin:12px 0 2px}.actions{display:flex;gap:8px;margin:13px 0}.actions button{flex:1;background:#40578e;color:white;border:1px solid #7793cd;border-radius:12px;min-height:45px;font-size:15px;font-weight:700}.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.controls button{border:0;border-radius:13px;background:#f3ca64;color:#142249;min-height:59px;font-size:26px;font-weight:800;touch-action:manipulation;box-shadow:0 4px 0 #aa7b36}.controls button:active{transform:translateY(3px);box-shadow:0 1px 0 #aa7b36}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #fff;outline-offset:2px}.controls small{display:block;font-size:10px;line-height:1}footer{text-align:center;color:#aabce3;font-size:12px;line-height:1.5;margin-top:12px}@media(max-width:390px){.wrap{padding:10px 10px 24px}.stage{grid-template-columns:minmax(0,1fr) 96px;gap:8px}.aside{padding:6px}.aside h2{font-size:13px}.aside p{font-size:11px}}
</style></head><body><main class="wrap"><header><h1>✨ 星星俄罗斯方块</h1><p>排满一整行，就能消除得分！</p></header><div class="stats"><div class="stat"><small>分数</small><strong id="score">0</strong></div><div class="stat"><small>消除行数</small><strong id="lines">0</strong></div><div class="stat"><small>等级</small><strong id="level">1</strong></div></div><div class="stage"><div class="board-wrap"><canvas id="board" width="300" height="600" aria-label="俄罗斯方块游戏场地" role="img"></canvas><div class="overlay" id="overlay" hidden><strong id="overlayTitle"></strong><span id="overlayHint"></span></div></div><aside class="aside"><h2>下一个</h2><canvas id="next" width="112" height="112" aria-label="下一个方块" role="img"></canvas><p>← → 移动<br>↑ 旋转 · ↓ 加速<br>空格：直接落下<br>P：暂停</p></aside></div><div class="actions"><button id="pause" type="button">⏸ 暂停</button><button id="restart" type="button">🔄 重新开始</button></div><div class="controls" aria-label="手机操作按钮"><button type="button" data-action="left" aria-label="左移">⬅<small>左移</small></button><button type="button" data-action="rotate" aria-label="旋转">⟳<small>旋转</small></button><button type="button" data-action="right" aria-label="右移">➡<small>右移</small></button><button type="button" data-action="down" aria-label="加速下落">⬇<small>下落</small></button><button type="button" data-action="drop" aria-label="直接落下">⤓<small>落底</small></button></div><footer>手机点按钮，电脑用方向键。消除越多，方块落得越快！</footer></main><script>
'use strict';(()=>{
const board=document.getElementById('board'),ctx=board.getContext('2d'),nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d');
const COLS=10,ROWS=20,SIZE=30,SHAPES={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const COLORS={I:'#48d9e8',O:'#ffe06d',T:'#c697f6',S:'#72e5a5',Z:'#fa849a',J:'#82a9ff',L:'#ffb778'};
let grid,piece,next,bag,score,lines,level,paused,over,dropMs,lastTime,accumulator;
const clone=m=>m.map(row=>[...row]);
function newBag(){const a=Object.keys(SHAPES);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function drawCell(c,x,y,size=SIZE,target=ctx){target.fillStyle=COLORS[c];target.fillRect(x*size+1,y*size+1,size-2,size-2);target.fillStyle='#ffffff66';target.fillRect(x*size+3,y*size+3,size-6,3);target.strokeStyle='#ffffff44';target.strokeRect(x*size+1.5,y*size+1.5,size-3,size-3);}
function draw(){ctx.fillStyle='#131d3c';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#29365d';ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*SIZE+.5,0);ctx.lineTo(x*SIZE+.5,600);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*SIZE+.5);ctx.lineTo(300,y*SIZE+.5);ctx.stroke()}
for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x])drawCell(grid[y][x],x,y);
if(piece){let ghost={...piece};while(!collides(ghost,0,1))ghost.y++;forEachCell(ghost,(x,y)=>{if(y>=0){ctx.fillStyle='#ffffff24';ctx.fillRect(x*SIZE+2,y*SIZE+2,SIZE-4,SIZE-4)}});forEachCell(piece,(x,y)=>{if(y>=0)drawCell(piece.type,x,y)});}
nctx.fillStyle='#17213e';nctx.fillRect(0,0,112,112);if(next){let m=SHAPES[next],s=23,ox=(112-m[0].length*s)/2,oy=(112-m.length*s)/2;for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){nctx.fillStyle=COLORS[next];nctx.fillRect(ox+x*s+1,oy+y*s+1,s-2,s-2);nctx.fillStyle='#ffffff66';nctx.fillRect(ox+x*s+3,oy+y*s+3,s-6,3)}}}
function forEachCell(p,fn){p.matrix.forEach((row,y)=>row.forEach((cell,x)=>{if(cell)fn(p.x+x,p.y+y)}));}
function collides(p,dx=0,dy=0){let hit=false;forEachCell(p,(x,y)=>{x+=dx;y+=dy;if(x<0||x>=COLS||y>=ROWS||(y>=0&&grid[y][x]))hit=true});return hit;}
function getType(){if(!bag.length)bag=newBag();return bag.pop();}
function spawn(){let type=next;next=getType();let matrix=clone(SHAPES[type]);piece={type,matrix,x:Math.floor((COLS-matrix[0].length)/2),y:0};if(collides(piece)){over=true;paused=false;piece=null;showOverlay('游戏结束','点「重新开始」再挑战一次！')}draw();}
function sync(){document.getElementById('score').textContent=score;document.getElementById('lines').textContent=lines;document.getElementById('level').textContent=level;document.getElementById('pause').textContent=paused?'▶ 继续':'⏸ 暂停';}
function showOverlay(title,hint){document.getElementById('overlayTitle').textContent=title;document.getElementById('overlayHint').textContent=hint;document.getElementById('overlay').hidden=false;}
function reset(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));bag=[];next=getType();piece=null;score=0;lines=0;level=1;paused=false;over=false;dropMs=750;lastTime=performance.now();accumulator=0;document.getElementById('overlay').hidden=true;spawn();sync();draw();}
function clearLines(){let cleared=0;for(let y=ROWS-1;y>=0;y--)if(grid[y].every(Boolean)){grid.splice(y,1);grid.unshift(Array(COLS).fill(null));cleared++;y++;}if(cleared){score+=[0,100,300,500,800][cleared]*level;lines+=cleared;level=1+Math.floor(lines/10);dropMs=Math.max(105,750-(level-1)*65);}sync();}
function lock(){forEachCell(piece,(x,y)=>{if(y>=0)grid[y][x]=piece.type});clearLines();spawn();}
function move(dx){if(paused||over||!piece)return false;if(!collides(piece,dx,0)){piece.x+=dx;draw();return true}return false;}
function rotate(){if(paused||over||!piece)return false;let a=piece.matrix,rot=a[0].map((_,i)=>a.map(row=>row[i]).reverse());for(const shift of [0,-1,1,-2,2]){let candidate={...piece,matrix:rot,x:piece.x+shift};if(!collides(candidate)){piece=candidate;draw();return true}}return false;}
function down(manual=false){if(paused||over||!piece)return false;if(!collides(piece,0,1)){piece.y++;if(manual){score++;sync()}draw();return true}lock();return false;}
function hardDrop(){if(paused||over||!piece)return;let steps=0;while(!collides(piece,0,1)){piece.y++;steps++}score+=steps*2;lock();sync();}
function togglePause(){if(over)return;paused=!paused;lastTime=performance.now();accumulator=0;document.getElementById('overlay').hidden=!paused;if(paused)showOverlay('暂停中','点继续，方块就会接着落下');sync();}
function frame(time){let delta=Math.min(100,time-lastTime);lastTime=time;if(!paused&&!over){accumulator+=delta;if(accumulator>=dropMs){accumulator=0;down();}}requestAnimationFrame(frame)}
const actions={left:()=>move(-1),right:()=>move(1),rotate,down:()=>down(true),drop:hardDrop};
document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>actions[button.dataset.action]()));
document.getElementById('pause').addEventListener('click',togglePause);document.getElementById('restart').addEventListener('click',reset);
document.addEventListener('keydown',e=>{const keys={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'rotate',ArrowDown:'down',Space:'drop',KeyP:'pause'};let action=keys[e.code];if(!action)return;e.preventDefault();if(e.repeat&&(action==='rotate'||action==='drop'||action==='pause'))return;if(action==='pause')togglePause();else actions[action]();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&!over)togglePause();});
window.__tetris={snapshot:()=>({grid:grid.map(row=>[...row]),piece:piece&&{...piece,matrix:clone(piece.matrix)},next,bag:[...bag],score,lines,level,paused,over,dropMs}),move,rotate,down,hardDrop,reset,togglePause};
if(new URLSearchParams(location.search).has('test'))window.__tetris.setupLineTest=()=>{reset();grid[ROWS-1]=Array(COLS).fill('O');grid[ROWS-1][COLS-1]=null;piece={type:'I',matrix:[[1],[1],[1],[1]],x:COLS-1,y:0};draw();};
reset();requestAnimationFrame(frame);
})();
</script></body></html>
