<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11182f"><title>俄罗斯方块</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#324477,#10162a 70%);color:#f5f7ff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;min-height:100svh}.app{width:min(100%,380px);margin:auto;padding:12px 14px 20px;text-align:center}h1{color:#ffe08a;font-size:28px;margin:0 0 3px}p{margin:5px 0;font-size:13px;color:#c8d4f0}.stats{display:flex;justify-content:center;gap:10px;margin:10px 0}.stat{background:#263659;border:1px solid #50628b;border-radius:12px;padding:6px 8px;min-width:0;flex:1}.stat small{display:block;font-size:11px;color:#c8d4f0}.stat strong{font-size:clamp(13px,4.5vw,21px);overflow-wrap:anywhere}.board{position:relative;width:min(340px,100%);margin:10px auto;aspect-ratio:1;border:3px solid #91a5d8;border-radius:12px;overflow:hidden;background:#121d38;touch-action:none;box-shadow:0 8px 24px #0005}canvas{display:block;width:100%;height:100%}.message{min-height:38px;margin:8px 0;font-size:14px;font-weight:bold;color:#ffe08a;display:grid;place-items:center}.tray{display:flex;gap:8px;justify-content:center;touch-action:none}.piece{position:relative;flex:1;min-width:0;height:116px;background:#263659;border:2px solid #4c638d;border-radius:14px;touch-action:none;cursor:grab;padding:6px}.piece.selected{border-color:#ffe08a;background:#35446a}.piece:disabled{opacity:.35;cursor:default}.piece canvas{width:100%;height:100%}.actions{display:flex;justify-content:center;gap:10px;margin:14px 0}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}#restart{padding:11px 24px;background:#f4cd6e;color:#172241;border:0;border-radius:12px;font-size:15px;font-weight:bold;min-height:44px;cursor:pointer}.ghost{position:fixed;pointer-events:none;z-index:5;opacity:.86;display:none;filter:drop-shadow(0 5px 8px #0008)}.overlay{position:absolute;inset:0;display:grid;place-content:center;background:#0b1631de;padding:20px}.overlay[hidden]{display:none}.overlay strong{font-size:26px;color:#ffe08a}.overlay p{font-size:14px;line-height:1.7}.flash{animation:flash .35s ease-out}@keyframes flash{50%{border-color:#fff;box-shadow:0 0 28px #70f6d4}}footer{font-size:12px;color:#aabce3;line-height:1.6}.piece:focus-visible,#restart:focus-visible{outline:3px solid white;outline-offset:2px}@media(max-height:700px){.app{padding-top:7px}.board{width:280px;margin:6px auto}.piece{height:100px}.message{margin:4px 0;min-height:32px}.stats{margin:6px 0}.actions{margin:10px 0}}
@media(max-height:620px){.app{padding-top:5px}.board{width:232px}.piece{height:90px}.message{min-height:28px}.actions{margin:8px 0}}
</style></head><body><main class="app"><h1>✨ 俄罗斯方块</h1><p>拖拖方块 · 想放哪里，就拖到哪里</p><div class="stats"><div class="stat"><small>得分</small><strong id="score">0</strong></div><div class="stat"><small>倍率</small><strong id="multiplier">×1</strong></div><div class="stat"><small>最高分</small><strong id="best">0</strong></div></div><p>🏆 历史最高倍率：<span id="bestMultiplier">×1</span></p><div class="board" id="boardWrap"><canvas id="board" width="320" height="320" aria-label="八乘八方块棋盘"></canvas><div id="overlay" class="overlay" hidden><strong>这局结束啦！</strong><p id="final"></p></div></div><div class="message" id="message" aria-live="polite">把下面的方块拖到棋盘空位吧！</div><div class="tray" aria-label="三个可拖动的方块"><button class="piece" data-slot="0" aria-label="拖动第一个方块"><canvas width="120" height="100"></canvas></button><button class="piece" data-slot="1" aria-label="拖动第二个方块"><canvas width="120" height="100"></canvas></button><button class="piece" data-slot="2" aria-label="拖动第三个方块"><canvas width="120" height="100"></canvas></button></div><div class="actions"><button id="restart">🔄 重新开始</button></div><footer>每放一个：×2、×3、×4……倍率一直往上！<br>三个用完，再来三个 · 满行或满列就消除<br>全都放不下就输了，棋盘会清空<br>也可以先点一个方块，再点棋盘放下</footer></main><canvas id="ghost" class="ghost"></canvas><script src="game.js"></script></body></html>
